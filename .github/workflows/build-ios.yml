name: Build iOS App (Simulator)

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web app
        working-directory: frontend
        run: npm run build

      - name: Remove Windows-generated iOS project
        working-directory: frontend
        run: rm -rf ios

      - name: Add iOS platform
        working-directory: frontend
        run: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync ios

      - name: Build iOS app for Simulator
        working-directory: frontend/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | tail -50
          # Check if build succeeded
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "✅ Build succeeded"
          else
            echo "❌ Build failed. Last 100 lines:"
            tail -100 build.log
            exit 1
          fi

      - name: Compress .app bundle
        working-directory: frontend/ios/App
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          zip -r eduvy-ai-simulator.zip "$APP_PATH"

      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: eduvy-ai-ios-simulator
          path: frontend/ios/App/eduvy-ai-simulator.zip
          retention-days: 30
